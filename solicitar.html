<script>
const p = new URLSearchParams(location.search);
if (p.get('error')) document.getElementById('msg-error').style.display = 'block';

const srv = p.get('srv');
if (srv) {
  const sel = document.getElementById('sel-srv');
  for (let o of sel.options) { if (o.value === srv) { o.selected = true; break; } }
}

// Tabla de precios por servicio
const PRECIOS = {
  'Desarrollo de Software':     4500000,
  'Diseño Web Profesional':     2800000,
  'Automatización de Procesos': 3200000,
  'Mantenimiento de Sistemas':  1200000,
  'Soporte Técnico':             360000,
  'Seguridad Digital':          3800000,
  'Consultoría Tecnológica':     850000,
  'Bases de Datos':             2200000
};

// Leer monto desde URL o desde tabla
const montoUrl = parseInt(p.get('monto') || '0');
const montoRef = montoUrl > 0 ? montoUrl : (srv ? (PRECIOS[srv] || 0) : 0);
document.getElementById('inp-monto-ref').value = montoRef;

fetch('../api/sesion.php').then(r => r.json()).then(d => {
  const sp = document.getElementById('sp');
  if (d.logueado) {
    document.getElementById('inp-nombre').value = d.usuario;
    sp.innerHTML = `<span class="user-badge"><i class="fa-solid fa-user"></i> ${d.usuario}</span>
      <a href="../api/logout.php" style="padding:8px 14px;border-radius:50px;background:rgba(255,255,255,.6);border:1.5px solid rgba(199,116,149,.3);color:var(--plum);text-decoration:none;font-size:13px;font-weight:700;"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>`;
  } else {
    sp.innerHTML = `<a href="../index.php" style="padding:8px 14px;border-radius:50px;background:linear-gradient(135deg,var(--pink-dark),var(--plum));color:#fff;text-decoration:none;font-size:13px;font-weight:700;"><i class="fa-solid fa-lock"></i> Iniciar Sesion</a>`;
  }
});
</script>
